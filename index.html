/* ===== 画面遷移・ボタン演出・ロード画面 ===== */
html{scroll-behavior:smooth}#app{transition:max-width .3s ease}
#app.scr-in>*{animation:scrIn .4s cubic-bezier(.2,.7,.2,1) both}
#app.scr-in>*:nth-child(2){animation-delay:.04s}#app.scr-in>*:nth-child(3){animation-delay:.08s}#app.scr-in>*:nth-child(4){animation-delay:.12s}#app.scr-in>*:nth-child(5){animation-delay:.16s}#app.scr-in>*:nth-child(n+6){animation-delay:.2s}

@keyframes ldfd{from{opacity:0}to{opacity:1}}#nmo,.tpop{animation:ldfd .25s}
body button,.gr[onclick],summary{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}

button::after,.gr[onclick]::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,#ffffff59 50%,transparent 65%);transform:translateX(-120%)}
.sw::after{animation:swp .55s ease-out}@keyframes swp{to{transform:translateX(120%)}}
.gr[onclick]:active{background:#2d3a22}
@media(prefers-reduced-motion:reduce){#app.scr-in>*,.rip,.sw::after{animation:none}}

async function init(){
 if(window.FB&&window.FB.db&&window.FB.uid){db=window.FB.db;uid=window.FB.uid;online=true}
 if(!db||!uid){online=false;db=localDB();uid=sessionStorage.nkid||(sessionStorage.nkid=Math.random().toString(36).slice(2))}
 if(!db||!uid){$("app").innerHTML="<h1>NIKAKEIBA GP</h1><p>この環境ではマルチプレイ機能を使えません。claude.aiにサインインして、このページを開き直してください。</p>";return}
 render();setInterval(tick,1000);setInterval(()=>{const e=$("cd");if(e&&room&&room.phase==="betting")e.textContent=Math.max(0,Math.ceil((room.deadline-Date.now())/1000));fx();cdFx();try{kbFx();zcFx();visFx();bthFx();recFx()}catch(e){}},250);requestAnimationFrame(loop)}

/* ===== 投票締切カウントダウン演出 ===== */
let cdLast=-1;
function cdFx(){const ov=document.getElementById("cdo"),bar=document.getElementById("cdb");
 if(!room||room.phase!=="betting"){if(ov)ov.remove();cdLast=-1;return}
 const ms=Math.max(0,room.deadline-Date.now()),sec=Math.ceil(ms/1000),hot=sec>0&&sec<=5;
 if(bar){bar.style.width=Math.min(100,ms/600)+"%";bar.className=hot?"hot":sec<=15?"warn":""}
 const cd=document.getElementById("cd");if(cd)cd.className=hot?"cdh":"";
 if(!hot){if(ov)ov.remove();cdLast=-1;return}
 let o=ov;if(!o){o=document.createElement("div");o.id="cdo";document.body.appendChild(o)}
 if(sec!==cdLast){cdLast=sec;try{sfx("beep")}catch(e){}
  o.style.setProperty("--k",String(6-sec));
  o.innerHTML='<div class="cdn"><small>投票締切まで</small><b>'+sec+'</b><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><circle class="rg" cx="50" cy="50" r="46"/></svg></div>'}}

async function create(){if(!ui.name.trim())return fail("名前を入力してください");
 code=String(100000+Math.floor(Math.random()*900000));try{const H=genHorses();setHorses(H,null);const hist=genHist();await rr().set({host:uid,phase:"lobby",round:0,horses:H,hist});await enter(true)}catch(e){code=null;fail("接続エラー: "+(e.code||e.message))}}
async function join(){if(!ui.name.trim())return fail("名前を入力してください");code=ui.code.trim();
 try{const s=await rr().get();if(!s.exists){code=null;return fail("部屋が見つかりません"+(online?"":"(LOCALモード:別端末の部屋は見えません)"))}await enter(false,s.data())}catch(e){code=null;fail("接続エラー: "+(e.code||e.message))}}
async function enter(host,r){const m=await pr(uid).get();
 if(!m.exists)await pr(uid).set({name:ui.name.trim().slice(0,12),money:(host||!r||r.phase==="lobby")?1000:0,bets:[]});
 const my=code;rr().onSnapshot(s=>{if(code!==my)return;room=s.data();applyRoom();isHost=room&&room.host===uid;render()});
 db.collection("rooms/"+code+"/players").onSnapshot(s=>{if(code!==my)return;players={};s.docs.forEach(d=>players[d.id]=d.data());render()});
 secRef=db.doc("data/users/"+uid+"/sec"+code);if(host)sec={};else{const g=await secRef.get();sec=g.exists?g.data():{}}
 if(host)await secRef.set({init:1})}
function fail(m){err=m;render()}

async function nextRound(){const r=(room.round||0)+1,forms=rndForms();
 const hints=forms.map(f=>Math.random()<.7?f:Math.floor(Math.random()*3));sec["r"+r]=forms;await secRef.set(sec);
 await rr().update({phase:"betting",round:r,deadline:Date.now()+60000,hints,result:null,pool:Array(10).fill(0),p:wxPrior(RI(r))})}
function pools(){const pool=Array(10).fill(0);Object.values(players).forEach(pl=>(pl.bets||[]).filter(b=>b.r===room.round).forEach(b=>b.p.forEach(k=>pool[k]+=b.a/b.p.length)));return pool}
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
async function tick(){if(!room||!isHost||busy)return;busy=true;try{const now=Date.now();
 if(room.phase==="lobby"){}
 else if(room.phase==="betting"){
  if(now>=room.deadline){const f=sec["r"+room.round]||room.hints,pw=AB.map((a,i)=>a*(1+FM[f[i]])+gauss()*6*1.2*TV[i]);
   const sm=simRace(f,RI(room.round)),order=sm.order,T=sm.T,ph=sm.ph,tl=sm.tl;
   const pool=pools();await rr().update({phase:"racing",startAt:now+PRE*1000,pool,p:probs(pool),result:{order,T,ph,tl,dt:.5,forms:f}})}
  else{const pool=pools(),k=JSON.stringify(pool);if(k!==JSON.stringify(room.pool))await rr().update({pool,p:probs(pool)})}}
 else if(room.phase==="racing"){if(now>=room.startAt+settleSec(room.result)*1000){const o=room.result.order,p=room.p;
  for(const id in players){const pl=players[id];let pay=0;(pl.bets||[]).filter(b=>b.r===room.round).forEach(b=>{const w=b.t==="win"?b.p[0]===o[0]:b.t==="place"?o.slice(0,3).includes(b.p[0]):(b.p.includes(o[0])&&b.p.includes(o[1]));if(w)pay+=Math.floor(b.a*oddsOf(p,b.t,b.p))});
   await pr(id).update({money:pl.money+pay,last:{r:room.round,pay}})}
  const nh=HIST.map((h,i)=>[...h,o.indexOf(i)+1].slice(-5)),lg={...(room.log||{}),["r"+room.round]:{o,t:room.result.T.map(x=>Math.round(x*1e3)/1e3)}};
  await rr().update({phase:room.round>=RT()?"finished":"settled",nextAt:now+10000,hist:nh,log:lg})}}
 else if(room.phase==="settled"&&now>=room.nextAt)await nextRound()
 }catch(e){}busy=false}

const BORROW=1000,LOW=50;
async function borrow(){const m=me();if(!room||room.phase!=="betting"||m.money>=LOW)return;await pr(uid).update({money:m.money+BORROW,debt:(m.debt||0)+BORROW})}
const net=p=>(p.money||0)-(p.debt||0);
async function bet(){const need=ui.type==="quin"?2:1;if(ui.picks.length!==need||room.phase!=="betting"||Date.now()>=room.deadline||me().money<ui.amt)return;
 const m=me();await pr(uid).update({money:m.money-ui.amt,bets:[...(m.bets||[]),{r:room.round,t:ui.type,p:[...ui.picks].sort((a,b)=>a-b),a:ui.amt}]});ui.picks=[]}
function pick(i){const n=ui.type==="quin"?2:1,x=ui.picks.indexOf(i);if(x>=0)ui.picks.splice(x,1);else{ui.picks.push(i);if(ui.picks.length>n)ui.picks.shift()}render()}
const setT=t=>{ui.type=t;ui.picks=[];render()}, setA=a=>{ui.amt=a;render()};

const FCOL=["#59d98a","#ffffff","#ff6b5b"],fchip=f=>`<span class="ch" style="color:${FCOL[f]}">調子 ${F[f]}</span>`,
 hchip=r=>`<span class="hs ${r<=3?"g"+r:"g0"}">${r}</span>`;
function rkPanel(){const lg=room.log||{},ks=Object.keys(lg).map(k=>+k.slice(1)).sort((a,b)=>a-b);
 if(!ks.length)return`<div class="c"><h2>🐎 ラウンド別 馬ランキング</h2><p class="mu">第1レース終了後に表示されます</p></div>`;
 const sel=ks.includes(ui.rk)?ui.rk:ks[ks.length-1],L=lg["r"+sel],o=L.o,t=L.t,bd=h=>`<span class="hn" style="background:${WK[h]};color:${wkTx(h)}">${h+1}</span>`;
 const rk=NAMES.map((_,h)=>ks.map(k=>lg["r"+k].o.indexOf(h)+1)),av=rk.map(a=>avg(a)),pts=rk.map(a=>a.reduce((s,x)=>s+(x<=3?4-x:0),0));
 const ord=[...NAMES.keys()].sort((a,b)=>av[a]-av[b]||a-b);
 return`<div class="c"><h2>🐎 ラウンド別 馬ランキング</h2><div class="tabs" style="margin-bottom:8px">${[...ks].reverse().map(k=>`<button class="${k===sel?"on":""}" onclick="ui.rk=${k};render()">第${k}R</button>`).join("")}</div>
 <div class="sc"><table><tr><th>着</th><th>馬</th><th>馬名</th><th>脚質</th><th>タイム</th><th>着差</th></tr>${o.map((h,k)=>`<tr><td>${k+1}</td><td>${bd(h)}</td><td>${NAMES[h]}</td><td>${TYPE[h]}</td><td>${fmtT(t[h])}</td><td>${k?fmtL(t[h]-t[o[0]]):"-"}</td></tr>`).join("")}</table></div>
 <h2>通算成績(平均着順順)</h2><div class="sc"><table><tr><th>#</th><th>馬</th><th>馬名</th>${[...ks].reverse().map(k=>`<th>R${k}</th>`).join("")}<th>平均</th><th>3着内P</th></tr>${ord.map((h,n)=>`<tr><td>${n+1}</td><td>${bd(h)}</td><td>${NAMES[h]}</td>${[...rk[h]].reverse().map(x=>`<td${x===1?' style="color:#ffd35c;font-weight:800"':""}>${x}</td>`).join("")}<td>${av[h].toFixed(1)}</td><td>${pts[h]}</td></tr>`).join("")}</table></div><p class="mu" style="margin:6px 0 0;font-size:11px">3着内P = 1着3点・2着2点・3着1点</p></div>`}
function rank(){const a=Object.entries(players).sort((x,y)=>net(y[1])-net(x[1]));return`<table><tr><th>#</th><th>名前</th><th>所持金</th><th>借金</th><th>純資産</th></tr>${a.map(([id,p],i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}${id===uid?"(あなた)":""} ${badges(p,id===uid)}</td><td>${p.money}</td><td style="color:${p.debt?"#ff6b5b":"inherit"}">${p.debt?"-"+p.debt:0}</td><td><b>${net(p)}</b></td></tr>`).join("")}</table>`}
function render(){const a=$("app");if(!a||!db)return;
 if(!room){a.innerHTML=`<div class="hero"><div class="plq">${TITLE_SVG}</div><span class="s0">● ${online?"ONLINE 共有DB接続":"LOCAL 同一ブラウザのみ(友達と遊べません)"+(window.FBERR?"<br><small>"+esc(window.FBERR)+"</small>":"")}</span></div><div class="c lob"><div class="gh">ENTRY</div><p class="mu" style="margin:0 0 6px">ロビーで決めたラウンド数(3〜10)で最も所持金を増やした人が優勝。初期所持金は1000。</p>
